apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the base configuration
resources:
  - ../../

# Production-specific configuration
namespace: eshop-prod

# Override labels for production
commonLabels:
  app.kubernetes.io/name: eshop-webforms
  app.kubernetes.io/version: "1.0"
  app.kubernetes.io/component: application
  environment: production

# Production image
images:
  - name: your-registry/eshop-webforms
    newTag: "1.0.0"  # Use specific version tag for production

# Patches for production
patchesStrategicMerge:
  - production-patches.yaml

# Production-specific configuration
configMapGenerator:
  - name: eshop-webforms-config-prod
    literals:
      - UseMockData=false
      - UseAzureStorage=true
      - UseAzureManagedIdentity=true
      - UseCustomizationData=true
      - UseAzureActiveDirectory=true