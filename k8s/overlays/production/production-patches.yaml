apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-webforms
spec:
  replicas: 3  # Scale up for production
  template:
    spec:
      containers:
      - name: eshop-webforms
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        # Production-specific environment variables
        env:
        - name: ASPNET_ENVIRONMENT
          value: "Production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
spec:
  template:
    spec:
      containers:
      - name: sqlserver
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "2000m"