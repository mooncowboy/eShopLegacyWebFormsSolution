apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eshop-webforms-ingress
  namespace: eshop
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: eshop.local  # Change to your desired hostname
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eshop-webforms-service
            port:
              number: 80