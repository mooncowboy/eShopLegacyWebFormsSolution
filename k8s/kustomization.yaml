apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eshop

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - sqlserver-pvc.yaml
  - sqlserver.yaml
  - webapp.yaml
  # - ingress.yaml  # Uncomment if using ingress

# Patches for different environments
patches:
  # - patches/production.yaml  # Uncomment and create for production overrides

# Common labels applied to all resources
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: eshop-webforms
      app.kubernetes.io/version: "1.0"
      app.kubernetes.io/component: application

# Images to replace (useful for different environments)
images:
  - name: your-registry/eshop-webforms
    newTag: latest