apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-webforms-config
  namespace: eshop-prod
data:
  UseMockData: "false"
  UseAzureStorage: "true"
  UseAzureManagedIdentity: "true"
  UseCustomizationData: "true"
  UseAzureActiveDirectory: "true"
  # Database connection will use secret for sensitive values
  DatabaseServer: "sqlserver-service"
  DatabaseName: "Microsoft.eShopOnContainers.Services.CatalogDb"