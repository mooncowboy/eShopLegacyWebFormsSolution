version: '3.8'

services:
  # SQL Server database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Pass@word123"
      MSSQL_PID: "Express"
    ports:
      - "5433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Pass@word123 -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Web application
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - UseMockData=false
      - UseAzureStorage=false
      - UseAzureManagedIdentity=false
      - UseCustomizationData=false
      - CatalogDBContext=Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnContainers.Services.CatalogDb;User Id=sa;Password=Pass@word123;TrustServerCertificate=true
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - eshop-network

volumes:
  sqlserver_data:

networks:
  eshop-network:
    driver: bridge